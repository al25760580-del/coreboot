name: Build ThinkPad T470s coreboot with EDK2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ThinkPad T470s (coreboot + EDK2 UEFI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: true
          fetch-depth: 0

      - name: Merge latest main into the build workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          # This merge is intentionally kept in the runner workspace only.
          # A conflict makes this step fail, so the build will not start.
          git merge --no-ff --no-edit --no-commit origin/main
          git status --short
          git log --oneline -2

      - name: Build in coreboot SDK container
        run: |
          docker run --rm \
            -u 0:0 \
            -v "$GITHUB_WORKSPACE":/home/coreboot/coreboot \
            -w /home/coreboot/coreboot \
            coreboot/coreboot-sdk:testing \
            /bin/bash -c "
              git config --global --add safe.directory /home/coreboot/coreboot && \
              make distclean || true && \
              make defconfig KBUILD_DEFCONFIG=configs/config.lenovo_thinkpad_t470s_edk2 && \
              make -j\$(nproc)
            "

      - name: Check ROM size
        run: test "$(stat -c %s build/coreboot.rom)" -eq 16777216

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coreboot-t470s-edk2-rom
          path: |
            build/coreboot.rom
            build/config.h
            .config
          if-no-files-found: error
